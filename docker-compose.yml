version: '3.8' # 'latest' is not a valid docker-compose version, use standard 3.8
services:

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"  #host:container

  backend:
    build: ./backend
    ports:
      - "8000:8000"  #host:container
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${DATABASE_PASSWORD}@database:5432/${POSTGRES_DB}
      MINIO_LOGIN: ${MINIO_LOGIN}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      MINIO_URL: storage:9000
    depends_on:
      - database
      - storage

  database:
    image: postgres:15.3-alpine
    ports:
      - "5433:5432"  # Allows connecting to the database, e.g. with DBeaver
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # BIND MOUNT: Saves data directly in the local 'postgres_data' folder
      - ./postgres_data:/var/lib/postgresql/data

  storage:
      image: minio/minio:latest
      ports:
        - "9000:9000" # Port for the application (backend)
        - "9001:9001" # Port for browser access (Web UI)
      environment:
        MINIO_ROOT_USER: ${MINIO_LOGIN}
        MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}

      volumes:
        - ./minio_data:/data 
      command: server /data --console-address ":9001"
volumes:
  postgres_data:
  minio_data: