name: Digit recognizer CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: digit_recognizer_db
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Start MinIO
        run: |
          cd minio_data
          mkdir -p minio_data_temp
          ls
          ./minio/minio server ./minio_data_temp --console-address ":9001" &

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run backend tests
        env: 
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/digit_recognizer_db
          MINIO_LOGIN: minioadmin
          MINIO_PASSWORD: minioadmin
          MINIO_URL: "localhost:9000"
        run: |
          ls
          pytest backend/tests/